on: [push]
jobs:
  test:
    strategy:
      matrix:
        ruby_version: ["4.0", "3.4", "3.3"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rake test
